# Gera a animação "snake" do gráfico de contribuições e publica no branch "output".
# O README consome os SVGs em raw.githubusercontent.com/brogliato/brogliato/output/...
name: Snake de contribuições

on:
  schedule:
    - cron: "0 */12 * * *"   # a cada 12 horas
  workflow_dispatch:          # permite rodar manualmente na aba Actions
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gerar SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=2563eb&color_dots=ebedf0,dbeafe,93c5fd,3b82f6,1d4ed8
            dist/github-snake-dark.svg?palette=github-dark&color_snake=06b6d4&color_dots=161b22,0c2a4d,1e3a8a,2563eb,06b6d4

      - name: Publicar no branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
